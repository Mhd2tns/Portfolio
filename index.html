<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehdi Lhioui — Photographer</title>
<meta name="description" content="Mehdi Lhioui, football photographer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e1913;
    --bg-alt: #12241a;
    --panel: #1c3527;
    --panel-2: #223f2d;
    --text: #f2f0e6;
    --text-muted: #a3b8a7;
    --green: #4f8f5c;
    --green-bright: #86c17d;
    --gold: #c9a24b;
    --border: rgba(242,240,230,0.14);
    --border-soft: rgba(242,240,230,0.08);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .wordmark{
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    text-transform: none;
    letter-spacing: 0.01em;
    margin: 0;
  }

  a{ color: inherit; text-decoration: none; }
  img{ max-width: 100%; display:block; }

  ::selection{ background: var(--green); color: var(--bg); }

  :focus-visible{
    outline: 2px solid var(--green-bright);
    outline-offset: 3px;
  }

  /* ---------- layout helpers ---------- */
  .wrap{
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- nav ---------- */
  .nav{
    position: fixed;
    top:0; left:0; right:0;
    z-index: 100;
    background: linear-gradient(to bottom, rgba(14,25,19,0.92), rgba(14,25,19,0));
    padding: 22px 0;
    transition: background .3s ease, padding .3s ease, box-shadow .3s ease;
  }
  .nav.scrolled{
    background: rgba(14,25,19,0.88);
    backdrop-filter: blur(10px);
    padding: 14px 0;
    box-shadow: 0 1px 0 var(--border-soft);
  }
  .nav-inner{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 24px;
  }
  .nav-social, .nav-cart{
    flex: 0 0 auto;
    min-width: 100px;
    display:flex;
    align-items:center;
  }
  .nav-cart{ justify-content:flex-end; }
  .nav-center{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 10px;
  }
  .wordmark{
    font-size: 20px;
    letter-spacing: 0.02em;
  }
  .nav-links{
    display:flex;
    gap: 30px;
    align-items:center;
  }
  .nav-links a{
    position: relative;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    padding: 4px 0;
    transition: color .2s ease;
  }
  .nav-links a::after{
    content:'';
    position:absolute;
    left:0; right:100%;
    bottom:-2px;
    height:1px;
    background: var(--green-bright);
    transition: right .25s ease;
  }
  .nav-links a:hover{ color: var(--text); }
  .nav-links a.active{ color: var(--text); }
  .nav-links a.active::after{ right:0; }

  .nav-social{ display:flex; gap:16px; }
  .nav-social a{ color: var(--text-muted); transition: color .2s ease; }
  .nav-social a:hover{ color: var(--green-bright); }
  .nav-social svg{ width:17px; height:17px; display:block; }

  .nav-toggle{ display:none; background:none; border:none; color:var(--text); cursor:pointer; padding:4px; }

  /* ---------- hero ---------- */
  .hero{
    position: relative;
    height: 100svh;
    min-height: 560px;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }
  .hero-media{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(120% 90% at 18% 20%, rgba(79,143,92,0.28), transparent 60%),
      linear-gradient(180deg, rgba(14,25,19,0.25) 0%, rgba(14,25,19,0.5) 60%, rgba(14,25,19,0.94) 100%),
      url('assets/hero-supporters.jpg');
    background-size: cover;
    background-position: center 30%;
  }
  .hero-media::before{ content: none; }
  .hero-content{
    position:relative;
    z-index:2;
    padding: 0 32px 72px;
    max-width: 1240px;
    margin: 0 auto;
    width:100%;
    opacity:0;
    transform: translateY(18px);
    animation: rise .9s cubic-bezier(.2,.8,.2,1) .25s forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  .hero-eyebrow{
    font-size:14px;
    color: var(--green-bright);
    font-weight:600;
    margin-bottom:10px;
  }
  .hero h1{
    font-size: clamp(52px, 11vw, 128px);
    line-height: 0.92;
  }
  .hero-tagline{
    margin-top: 18px;
    max-width: 46ch;
    font-size: 18px;
    color: var(--text-muted);
  }
  .scroll-cue{
    position:absolute;
    right:32px; bottom:36px;
    z-index:2;
    writing-mode: vertical-rl;
    font-size:12px;
    letter-spacing:.1em;
    color: var(--text-muted);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .scroll-cue .line{
    width:1px; height:46px;
    background: var(--border);
    position:relative;
    overflow:hidden;
  }
  .scroll-cue .line::after{
    content:'';
    position:absolute;
    top:-100%; left:0; width:100%; height:100%;
    background: var(--green-bright);
    animation: cue 2.2s ease-in-out infinite;
  }
  @keyframes cue{ 0%{top:-100%;} 60%{top:100%;} 100%{top:100%;} }

  /* ---------- section head ---------- */
  .gallery-section{ padding: 120px 0 140px; }
  .gallery-section.alt{ background: var(--bg-alt); }
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap: 40px;
    margin-bottom: 56px;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 28px;
  }
  .section-head h2{
    font-size: clamp(38px, 6vw, 64px);
    line-height: 1;
  }
  .section-head p{
    max-width: 38ch;
    color: var(--text-muted);
    font-size: 15px;
  }

  /* ---------- masonry ---------- */
  .masonry{
    columns: 4 260px;
    column-gap: 16px;
  }
  .tile{
    break-inside: avoid;
    margin-bottom: 16px;
    position:relative;
    border-radius: 3px;
    overflow:hidden;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    cursor: pointer;
  }
  .tile-inner{
    width:100%;
    background:
      linear-gradient(160deg, rgba(79,143,92,0.28), rgba(14,25,19,0) 55%),
      var(--panel);
    background-size: cover;
    background-position: center;
    display:flex;
    align-items:flex-end;
    padding: 14px;
  }
  .tile:nth-child(3n+1) .tile-inner{ aspect-ratio: 3/4; }
  .tile:nth-child(3n+2) .tile-inner{ aspect-ratio: 4/5; }
  .tile:nth-child(3n)   .tile-inner{ aspect-ratio: 1/1; }
  .tile:nth-child(5n)   .tile-inner{ aspect-ratio: 4/3; }
  .tile-label{
    font-size: 11px;
    letter-spacing:.06em;
    color: var(--text-muted);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tile-label svg{ width:14px; height:14px; opacity:.8; }
  .tile::after{
    content:'';
    position:absolute; inset:0;
    background: rgba(79,143,92,0);
    transition: background .25s ease;
  }
  .tile:hover::after{ background: rgba(79,143,92,0.12); }
  .tile:hover .tile-inner{ filter: brightness(1.05); }

  /* ---------- about ---------- */
  .about{
    padding: 120px 0;
    display:grid;
    grid-template-columns: 0.9fr 1.1fr;
    gap: 64px;
    align-items:center;
  }
  .about-portrait{
    aspect-ratio: 4/5;
    border-radius: 3px;
    background:
      linear-gradient(160deg, rgba(79,143,92,0.3), rgba(14,25,19,0) 60%),
      var(--panel);
    border: 1px solid var(--border-soft);
    position:relative;
    display:flex;
    align-items:flex-end;
    padding:16px;
  }
  .about h2{ font-size: clamp(34px, 5vw, 52px); margin-bottom:22px; }
  .about-text p{
    color: var(--text-muted);
    font-size: 16px;
    max-width: 52ch;
    margin: 0 0 16px;
  }
  .about-text p strong{ color: var(--text); font-weight:600; }
  .about-contact{
    margin-top: 28px;
    display:flex;
    flex-wrap: wrap;
    gap: 14px 28px;
  }
  .about-contact a{
    font-size:14px;
    font-weight:600;
    color: var(--text);
    border-bottom: 1px solid var(--green);
    padding-bottom:3px;
    transition: border-color .2s ease, color .2s ease;
  }
  .about-contact a:hover{ color: var(--green-bright); border-color: var(--green-bright); }

  /* ---------- footer ---------- */
  footer{
    border-top: 1px solid var(--border-soft);
    padding: 32px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .footer-social{ display:flex; gap:18px; }
  .footer-social a{ color: var(--text-muted); transition: color .2s ease; }
  .footer-social a:hover{ color: var(--green-bright); }
  .footer-social svg{ width:16px; height:16px; }

  /* ---------- lightbox ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(9,16,12,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 48px;
    animation: fadeIn .2s ease;
  }
  .lightbox.open{ display:flex; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .lightbox img{
    max-width: 90vw;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 3px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox-close{
    position:absolute;
    top: 24px; right: 28px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px; height: 40px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  .lightbox-close:hover{ color: var(--green-bright); border-color: var(--green-bright); }

  /* ---------- responsive ---------- */
  @media (max-width: 860px){
    .about{ grid-template-columns: 1fr; gap: 36px; }
  }
  @media (max-width: 720px){
    .wrap{ padding: 0 20px; }
    .nav-links{
      position: fixed;
      top: 0; right: 0;
      height: 100vh;
      width: min(78vw, 320px);
      background: var(--bg-alt);
      flex-direction: column;
      justify-content:center;
      align-items:flex-start;
      gap: 30px;
      padding: 40px;
      transform: translateX(100%);
      transition: transform .3s ease;
      border-left: 1px solid var(--border);
    }
    .nav-links.open{ transform: translateX(0); }
    .nav-links a{ font-size: 20px; }
    .nav-social{ display:none; }
    .nav-toggle{ display:block; z-index: 101; }
    .hero-content{ padding-bottom: 48px; }
    .scroll-cue{ display:none; }
    .masonry{ columns: 2 160px; }
    .section-head{ flex-direction:column; align-items:flex-start; gap:14px; }
  }
</style>
</head>
<body>

<header class="nav" id="siteNav">
  <div class="wrap nav-inner">
    <div class="nav-social">
      <a href="https://instagram.com/91.pics_productions" aria-label="Instagram" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1"/></svg>
      </a>
    </div>
    <div class="nav-center">
      <a href="index.html" class="wordmark">Mehdi Lhioui</a>
      <nav class="nav-links" id="navLinks">

        <a href="about.html">About me</a>
      </nav>

    <div class="nav-cart">
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

  </div>
</header>

  <a class="scroll-cue" href="#football"><span class="line"></span>Discover</a>
</section>

      <div class="tile" data-src="assets/tile-02.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-02.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-03.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-03.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-04.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-04.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-05.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-05.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-06.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-06.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-07.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-07.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-08.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-08.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-09.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-09.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-10.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-10.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-11.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-11.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-12.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-12.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-13.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-13.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-15.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-15.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-16.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-16.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-17.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-17.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-18.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-18.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-19.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-19.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-20.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-20.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-21.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-21.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-22.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-22.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-23.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-23.jpg')"></div></div>
      <div class="tile" data-src="assets/tile-25.jpg"><div class="tile-inner" style="background-image:linear-gradient(160deg, rgba(14,25,19,0.05), rgba(14,25,19,0.35) 75%), url('assets/tile-25.jpg')"></div></div>
    </div>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="">
</div>

<footer class="wrap">
  <span>© 2026 Mehdi Lhioui</span>
  <div class="footer-social">
    <a href="https://instagram.com/91.pics_productions" aria-label="Instagram" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1"/></svg>
    </a>
  </div>
</footer>

<script>
  // nav scroll state
  const nav = document.getElementById('siteNav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive:true });

  // mobile menu toggle
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open);
  });
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    navLinks.classList.remove('open');
    navToggle.setAttribute('aria-expanded', false);
  }));

  document.querySelector('.nav-links a[data-section="home"]').classList.add('active');

  // lightbox
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  document.querySelectorAll('.tile[data-src]').forEach(tile => {
    tile.addEventListener('click', () => {
      lightboxImg.src = tile.dataset.src;
      lightbox.classList.add('open');
    });
  });
  function closeLightbox(){ lightbox.classList.remove('open'); lightboxImg.src=''; }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
</html>
